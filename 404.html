<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Страница не найдена · НАВСЕГДА</title>
<meta http-equiv="refresh" content="3;url=/">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',sans-serif;background:#f6efe5;color:#2c241a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.card{max-width:520px;text-align:center;background:rgba(255,255,255,.55);border:1px solid rgba(140,110,70,.22);border-radius:16px;padding:44px 32px}
.big{font-family:'Cormorant Garamond',serif;font-size:5rem;font-weight:500;color:#a37b46;line-height:1}
h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:1.6rem;margin:14px 0 10px}
p{color:#8a7864;font-size:.94rem;line-height:1.6;margin-bottom:22px}
.btn{display:inline-block;padding:14px 28px;background:linear-gradient(135deg,#a37b46,#6b4a1e);color:#fff;text-decoration:none;border-radius:10px;font-family:'Montserrat',sans-serif;font-size:.86rem;letter-spacing:.08em;text-transform:uppercase}
small{display:block;margin-top:18px;color:#8a7864;font-size:.78rem}
</style>
</head>
<body>
<div class="card">
  <div class="big">404</div>
  <h1>Страница не найдена</h1>
  <p>Возможно, ссылка устарела или в адресе опечатка. Через 3 секунды откроется витрина КП.</p>
  <a class="btn" href="/">Открыть каталог КП</a>
  <small>НАВСЕГДА · агентство ивентов</small>
</div>
</body>
</html>
